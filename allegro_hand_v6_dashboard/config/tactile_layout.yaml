# Tactile wire order: thumb, index, middle, ring, pinky, palm.
# Each finger is tip, middle, base. Palm input order is bottom, middle(center), upper(left).
unit: hPa
pressure_min: 1000.0
pressure_max: 1200.0
svg_width: 1254
svg_height: 1254
# Source-image crop: x, y, width, height. The crop removes the transparent
# left margin so the visible hand is centered while retaining its full height.
image_crop: [198, 0, 1056, 1254]

