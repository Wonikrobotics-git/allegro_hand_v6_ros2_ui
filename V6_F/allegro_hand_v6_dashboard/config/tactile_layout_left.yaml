# Tactile wire order: thumb, index, middle, ring, pinky, palm.
# Each finger is tip, middle, base. Palm input order is bottom, middle(center), upper(left).
unit: hPa
pressure_min: 1000.0
pressure_max: 1200.0
svg_width: 1322
svg_height: 1190
# The left image has asymmetric transparent padding. The display offset is in
# source-image pixels and keeps the visible hand centered after scaling.
image_crop: [0, 0, 1322, 1190]
image_scale: 0.95
image_offset: [85, 0]

sensors:
  - {index: 0,  name: thumb_tip,   label: TT, group: Thumb,  frame_id: R14_Link, position: [0.0125, 0.0217, 0.001], normal: [0, 0, 1], svg: [97, 683], text_rotation: -56}
